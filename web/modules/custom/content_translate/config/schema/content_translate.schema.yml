content_translate.settings:
  type: config_object
  label: 'Content Translate settings'
  mapping:
    active_translator:
      type: string
      label: 'Active translator plugin ID'
    translators:
      type: sequence
      label: 'Per-translator provider configuration'
      sequence:
        type: content_translate.translator.[%key]

content_translate.translator.libretranslate:
  type: mapping
  label: 'LibreTranslate provider settings'
  mapping:
    api_url:
      type: string
      label: 'API endpoint URL'
    api_key:
      type: string
      label: 'API key'

content_translate.translator.google_translate:
  type: mapping
  label: 'Google Cloud Translation provider settings'
  mapping:
    api_key:
      type: string
      label: 'API key'

content_translate.translator.deepl:
  type: mapping
  label: 'DeepL provider settings'
  mapping:
    plan:
      type: string
      label: 'Plan (free or pro)'
    api_key:
      type: string
      label: 'API key'

content_translate.translator.azure_translator:
  type: mapping
  label: 'Azure AI Translator provider settings'
  mapping:
    endpoint:
      type: string
      label: 'API endpoint'
    region:
      type: string
      label: 'Resource region'
    api_key:
      type: string
      label: 'API key'
